<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="soft4" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="48"/>
  </filter>
  <filter id="mirror" x="-10%" y="-10%" width="120%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#05060C"/>
    <stop offset="48%" stop-color="#080A14"/>
    <stop offset="74%" stop-color="#12101C"/>
    <stop offset="100%" stop-color="#1B1119"/>
  </linearGradient>
  <radialGradient id="hglow" gradientUnits="userSpaceOnUse" cx="928" cy="630" r="896">
    <stop offset="0%" stop-color="#FFD3A0" stop-opacity=".98"/>
    <stop offset="18%" stop-color="#F5A055" stop-opacity=".85"/>
    <stop offset="52%" stop-color="#A44C1E" stop-opacity=".48"/>
    <stop offset="100%" stop-color="#1A0C08" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="below" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#E8A463" stop-opacity=".55"/>
    <stop offset="45%" stop-color="#7A3A1C" stop-opacity=".22"/>
    <stop offset="100%" stop-color="#0A0708" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#sky)"/>

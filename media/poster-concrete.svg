<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1067" width="1600" height="1067" preserveAspectRatio="xMidYMid slice">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="soft4" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="48"/>
  </filter>
  <filter id="mirror" x="-10%" y="-10%" width="120%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<defs>
  <linearGradient id="wallc" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#B9B5AC"/>
    <stop offset="55%" stop-color="#918D86"/>
    <stop offset="100%" stop-color="#5E5B56"/>
  </linearGradient>
  <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0.4">
    <stop offset="0%" stop-color="#2A2927" stop-opacity="0"/>
    <stop offset="100%" stop-color="#1E1D1C" stop-opacity=".92"/>
  </linearGradient>
  <linearGradient id="slit" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFF4DA"/>
    <stop offset="100%" stop-color="#F2C98C"/>
  </linearGradient>
  <radialGradient id="spill" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFE2AE" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#FFE2AE" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1600" height="1067" fill="url(#wallc)"/>
<rect x="0" y="0" width="1600" height="1067" fill="url(#shade)" opacity=".85"/>
<rect x="808" y="0" width="2" height="1067" fill="#4A4844" opacity=".7"/>
<rect x="813" y="0" width="1" height="1067" fill="#E6E0D4" opacity=".22"/>

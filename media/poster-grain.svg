<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="soft4" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="48"/>
  </filter>
  <filter id="mirror" x="-10%" y="-10%" width="120%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="0.6" y2="1">
    <stop offset="0%" stop-color="#D8C6AC"/>
    <stop offset="46%" stop-color="#B49C81"/>
    <stop offset="100%" stop-color="#6B5949"/>
  </linearGradient>
  <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#FFF3DC" stop-opacity=".95"/>
    <stop offset="100%" stop-color="#F6D9AC" stop-opacity=".55"/>
  </linearGradient>
  <radialGradient id="fall" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3A2A1E" stop-opacity="0"/>
    <stop offset="100%" stop-color="#2A1D14" stop-opacity=".9"/>
  </radialGradient>
</defs>
<rect width="1600" height="900" fill="url(#wall)"/>
<g transform="translate(160 54) skewY(6)">
  <rect x="0" y="0" width="960" height="558" fill="url(#light)" opacity=".92"/>
  <rect x="499" y="0" width="19" height="558" fill="#7A644E" opacity=".55"/>
  <rect x="0" y="307" width="960" height="9" fill="#7A644E" opacity=".55"/>
</g>
<ellipse cx="480" cy="306" rx="448" ry="234" fill="#FFF6E4" opacity=".22" filter="url(#soft4)"/>
<rect width="1600" height="900" fill="url(#fall)" opacity=".85"/>
<g opacity=".35">
  <circle cx="352" cy="270" r="1.6" fill="#FFF6E4"/>
  <circle cx="496" cy="216" r="1.2" fill="#FFF6E4"/>
  <circle cx="672" cy="333" r="1.4" fill="#FFF6E4"/>
  <circle cx="592" cy="405" r="1.0" fill="#FFF6E4"/>
  <circle cx="800" cy="252" r="1.3" fill="#FFF6E4"/>
  <circle cx="416" cy="468" r="1.1" fill="#FFF6E4"/>
</g>
<rect x="0" y="897" width="1600" height="3" fill="#E08A46"/>

<rect width="1600" height="900" filter="url(#grain)" opacity="0.22" style="mix-blend-mode:overlay"/>
</svg>
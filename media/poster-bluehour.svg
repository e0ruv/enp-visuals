  <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#FFD9A0"/>
    <stop offset="100%" stop-color="#E8964B"/>
  </linearGradient>
  <radialGradient id="lum" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#F0A85C" stop-opacity=".55"/>
    <stop offset="100%" stop-color="#F0A85C" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bleed" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#4C6FA8" stop-opacity=".40"/>
    <stop offset="100%" stop-color="#4C6FA8" stop-opacity="0"/>
  </radialGradient>
</defs>

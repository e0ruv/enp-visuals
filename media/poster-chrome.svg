<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1500" width="1000" height="1500" preserveAspectRatio="xMidYMid slice">
<defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="4" stitchTiles="stitch" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="26"/>
  </filter>
  <filter id="soft2" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="8"/>
  </filter>
  <filter id="soft4" x="-25%" y="-25%" width="150%" height="150%">
    <feGaussianBlur stdDeviation="48"/>
  </filter>
  <filter id="mirror" x="-10%" y="-10%" width="120%" height="160%">
    <feGaussianBlur stdDeviation="6"/>
  </filter>
</defs>

<defs>
